# Publie une nouvelle version du logiciel.
# Pour sortir la version 1.2.0 : changer "version" dans package.json, puis
#   git commit -am "Version 1.2.0" && git tag v1.2.0 && git push --follow-tags
# GitHub fabrique alors l'installateur Windows (.exe) et macOS (.dmg), les publie dans « Releases »,
# et les logiciels déjà installés se mettent à jour automatiquement au lancement suivant.
name: Publier une version

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fabriquer l'installateur et le déposer dans la version brouillon
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de certificat : installateurs non signés (voir README). Pour signer sur macOS, ajouter
          # les secrets CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # La version n'est rendue publique (et donc proposée en mise à jour) que si Windows ET macOS ont réussi.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publier la version
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
